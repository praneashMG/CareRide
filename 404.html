<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/fav.png" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>CareRide — Page Not Found</title>

    <script src="tailwind.js"></script>
    <style>
        /* --- Modern Professional Blue Palette (same as index) --- */
        :root, html[data-theme='light'] {
            --color-background: #FFFFFF;
            --color-primary-text: #1E293B;
            --color-secondary-text: #475569;
            --color-accent: #2563EB;
            --color-accent-light: #EFF6FF;
            --color-border: #E2E8F0;
            --color-hover: #F8FAFC;
            --color-footer-bg: #0F172A;
            --color-footer-text: #F1F5F9;
        }
        html[data-theme='dark'] {
            color-scheme: dark;
            --color-background: #020617;
            --color-primary-text: #F8FAFC;
            --color-secondary-text: #94A3B8;
            --color-accent: #3B82F6;
            --color-accent-light: #1E3A8A;
            --color-border: #1E293B;
            --color-hover: #0F172A;
            --color-footer-bg: #020617;
            --color-footer-text: #F8FAFC;
        }

        body {
            background-color: var(--color-background);
            color: var(--color-primary-text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        .text-primary-text { color: var(--color-primary-text); }
        .text-secondary-text { color: var(--color-secondary-text); }
        .text-accent { color: var(--color-accent); }
        .bg-background { background-color: var(--color-background); }
        .bg-hover { background-color: var(--color-hover); }
        .bg-accent { background-color: var(--color-accent); }
        .border-border { border-color: var(--color-border); }

        /* Typography Weight System */
        h1, h2, h3, h4, h5, h6 { font-weight: 500 !important; }
        p, .text-secondary-text { font-weight: 400 !important; }

        .bg-custom-gradient {
            background: linear-gradient(135deg, #3B82F6 0%, #1E3A8A 100%);
        }

        /* Buttons (same as index) */
        .btn-primary, .book-btn {
            background: linear-gradient(135deg, #3B82F6 0%, #1E3A8A 100%);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 700;
            text-align: center;
            border: 2px solid transparent;
        }
        .btn-primary:hover, .book-btn:hover {
            opacity: 0.88;
            transform: scale(1.04);
            box-shadow: 0 6px 18px rgba(59,130,246,0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--color-accent);
            border: 2px solid var(--color-accent);
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 700;
            text-align: center;
        }
        .btn-outline:hover {
            background: var(--color-accent);
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.25);
        }
        html[data-theme='dark'] .btn-outline {
            color: #3B82F6;
            border-color: #3B82F6;
        }
        html[data-theme='dark'] .btn-outline:hover {
            background: #3B82F6;
            color: #FFF;
        }
        .btn-cta-white {
            background: white;
            color: #2563EB;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-cta-white:hover {
            background: #f3f4f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        /* icon-btn */
        .icon-btn {
            transition: all 0.2s ease;
        }

        /* Custom 404 illustration styling */
        .error-illustration {
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.1));
        }

        .glow {
            text-shadow: 0 0 20px rgba(59,130,246,0.5);
        }

        /* RTL support – everything uses logical properties by default, but we handle margins/paddings if needed */
        html[dir="rtl"] .rtl-flip {
            transform: scaleX(-1);
        }

        /* Simple footer – reuse colors from main footer */
        #main-footer {
            background-color: var(--color-footer-bg);
            color: var(--color-footer-text);
        }
        #main-footer .footer-link:hover {
            color: #60A5FA;
            padding-left: 4px;
            transition: all 0.2s ease;
        }
        html[dir="rtl"] #main-footer .footer-link:hover {
            padding-left: 0;
            padding-right: 4px;
        }
    
        /* Fix native date/time picker icons in dark mode */
        html[data-theme='dark'] input[type="date"]::-webkit-calendar-picker-indicator,
        html[data-theme='dark'] input[type="time"]::-webkit-calendar-picker-indicator,
        html[data-theme='dark'] input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.5);
        }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <!-- No navigation, but we keep theme / RTL toggles? They are not required, but for consistency we keep small floating toggles (optional). 
         However, the requirement says "no nav required" — we can still include theme and RTL floating buttons for convenience, but they are not part of a nav bar. 
         Since the user wants same dark theme and RTL, we add a minimal floating controls block that doesn't function as a nav. -->
    
    <!-- Minimal floating controls (theme + RTL) – these are not a navigation bar -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-2 rtl:right-auto rtl:left-4">
        <button id="theme-toggle" class="icon-btn text-primary-text hover:text-accent p-2 rounded-xl bg-hover border border-border transition duration-200 shadow-sm">
            <svg class="w-5 h-5 light-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg class="w-5 h-5 dark-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="lang-icon" class="text-primary-text hover:text-accent p-2 rounded-xl bg-hover border border-border transition duration-200 shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
            </svg>
        </button>
    </div>

    <!-- Main content: centered 404 message -->
    <main class="flex-grow flex items-center justify-center px-4 py-20 bg-background">
        <div class="max-w-2xl w-full text-center">
            
            <!-- Logo – same as index -->
            <div class="flex justify-center mb-8">
                <a href="index.html" class="text-4xl sm:text-5xl font-serif font-extrabold tracking-wide flex items-center gap-3">    
                    <i class="fa-solid fa-hand-holding-heart text-accent text-5xl sm:text-6xl"></i>
                    <span class="text-accent">CareRide</span>
                </a>
            </div>

            <!-- Illustration / big 404 -->
            <div class="mb-8 relative">
                <div class="text-[120px] sm:text-[160px] font-black leading-none text-accent/20 select-none">404</div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <i class="fa-regular fa-compass text-6xl sm:text-7xl text-accent error-illustration"></i>
                </div>
            </div>

            <h1 class="text-3xl sm:text-4xl font-bold text-primary-text mb-4">Page not found</h1>
            <p class="text-lg text-secondary-text max-w-md mx-auto mb-10">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>

            <!-- Action buttons -->
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="index.html" class="btn-primary text-lg px-8 py-3 w-full sm:w-auto">
                    <i class="fa-solid fa-house mr-2"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-outline text-lg px-8 py-3 w-full sm:w-auto">
                    <i class="fa-solid fa-headset mr-2"></i> Contact Support
                </a>
            </div>

            <!-- Small hint / help text -->
            <div class="mt-12 text-sm text-secondary-text flex flex-wrap items-center justify-center gap-3">
                <i class="fa-regular fa-circle-question text-accent"></i>
                <span>Need assistance? Call us at <a href="tel:+18005550199" class="text-accent font-semibold hover:underline">+1 (800) 555-0199</a></span>
            </div>
        </div>
    </main>

    <!-- Footer – simplified, same branding and colors -->
    <footer id="main-footer" class="pt-12 pb-8 transition-colors duration-300 mt-auto">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 pb-8 border-b border-gray-800">
                <a href="index.html" class="text-2xl font-serif font-extrabold tracking-wide flex items-center gap-2">    
                    <i class="fa-solid fa-hand-holding-heart text-accent"></i>
                    <span class="text-accent">CareRide</span>
                </a>
                <div class="flex gap-6">
                    <a href="#" class="text-white/80 hover:text-accent transition text-xl"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="text-white/80 hover:text-accent transition text-xl"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="text-white/80 hover:text-accent transition text-xl"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
            <div class="py-6 text-center text-white/60 text-sm">
                © 2026 CareRide. All rights reserved. — Compassionate rides for seniors.
            </div>
        </div>
    </footer>

    <!-- Scripts: theme, RTL (same logic as index) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const html = document.documentElement;

            // Theme toggle
            const themeToggle = document.getElementById('theme-toggle');
            const applyTheme = (theme) => {
                html.setAttribute('data-theme', theme);
                document.querySelectorAll('.light-icon').forEach(i => i.classList.toggle('hidden', theme === 'dark'));
                document.querySelectorAll('.dark-icon').forEach(i => i.classList.toggle('hidden', theme === 'light'));
            };
            themeToggle.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', next);
                applyTheme(next);
            });
            applyTheme(localStorage.getItem('theme') || 'light');

            // RTL / language toggle
            const langToggle = document.getElementById('lang-icon');
            langToggle.addEventListener('click', () => {
                const current = localStorage.getItem('language') === 'ar' ? 'en' : 'ar';
                localStorage.setItem('language', current);
                html.setAttribute('dir', current === 'ar' ? 'rtl' : 'ltr');
            });
            // Initialize direction
            html.setAttribute('dir', localStorage.getItem('language') === 'ar' ? 'rtl' : 'ltr');
        });
    </script>
</body>
</html>
